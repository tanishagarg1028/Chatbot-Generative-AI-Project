<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aria — AI Chatbot</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1f2320;
    --muted: #6b6f6a;
    --accent: #2f6f4f;
    --accent-ink: #ffffff;
    --bot-bubble: #eef1ec;
    --user-bubble: #2f6f4f;
    --border: #e2e0da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 80vh;
  }
  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  #reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  #reset-btn:hover { background: var(--bg); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg .intent { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button[type=submit] {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Aria</h1>
        <p>Generative AI chatbot &middot; prompt-engineered</p>
      </div>
      <button id="reset-btn">Reset chat</button>
    </header>
    <div id="messages">
      <div class="msg bot">Hi, I'm Aria. Ask me anything — order status, a quick question, or just say hello.</div>
    </div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-input');
const messages = document.getElementById('messages');
const resetBtn = document.getElementById('reset-btn');

function addMessage(text, role, intent) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'bot' && intent) {
    const tag = document.createElement('span');
    tag.className = 'intent';
    tag.textContent = intent;
    div.appendChild(tag);
  }
  div.appendChild(document.createTextNode(text));
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  input.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (data.error) {
      addMessage('Error: ' + data.error, 'bot');
    } else {
      addMessage(data.response, 'bot', data.intent);
    }
  } catch (err) {
    addMessage('Network error — is the server running?', 'bot');
  } finally {
    input.disabled = false;
    input.focus();
  }
});

resetBtn.addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST' });
  messages.innerHTML = '';
  addMessage("Memory cleared. What's next?", 'bot');
});
</script>
</body>
</html>
